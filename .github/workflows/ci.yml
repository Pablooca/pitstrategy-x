name: PitStrategy-X CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  continuous-integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate Docker Compose Configuration
        run: |
          if [ -f "deployments/docker-compose.yml" ]; then
            echo "Validating deployments/docker-compose.yml..."
            docker compose -f deployments/docker-compose.yml config --quiet
            echo "Docker Compose file is valid."
          else
            echo "docker-compose.yml not present yet, skipping."
          fi

      - name: Sanity & Code Validation
        run: |
          echo "=========================================="
          echo "🚀 PitStrategy-X CI checks completed successfully!"
          echo "=========================================="